[package]
name = "tokio_udp_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std"] }
actix-web = "4"
actix-rt = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
bytes = "1"
thiserror = "1"
anyhow = "1"
