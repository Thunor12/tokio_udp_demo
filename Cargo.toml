[package]
name = "tokio_udp_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std"] }

# Logging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

# Actix for actor model
actix = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# XML parsing for BRICKS
quick-xml = { version = "0.31", features = ["serialize", "deserialize"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Lazy initialization
once_cell = "1.18"

# Web framework for HTTP/REST API (for Web Maintenance Server compatibility)
actix-web = "4"
actix-rt = "2"
bytes = "1"

[build-dependencies]
# XML parsing for build script
quick-xml = { version = "0.31", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
